name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        id: fonts-cache
        with:
          path: fonts
          key: fonts-dejavu-2.37
      - name: Download test fonts
        if: steps.fonts-cache.outputs.cache-hit != 'true'
        run: sh scripts/download-fonts.sh
      - run: npm run verify
