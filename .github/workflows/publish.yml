name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Allows testing the publish setup with a prerelease

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run verify

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish
        run: |
          version=$(node -p "require('./package.json').version")
          case "$version" in
            *-*) tag=next ;;
            *) tag=latest ;;
          esac
          npm publish --access public --provenance --tag "$tag"
